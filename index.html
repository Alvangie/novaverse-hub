<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaVerse | Superhero & Heroines Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <h1 class="header__title">
    <i class="fa-solid fa-bolt-lightning"></i> NovaVerse
  </h1>
  <p class="header__subtitle">Multiverse Directory: Heroines, Heroes & Comic Legends</p>
</header>

  <main class="container">
    <section class="controls">
      <div class="controls__group controls__group--search">
        <label for="search-input">Search character</label>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="e.g. Wanda, Spider-Man, Batman...">
          <button type="button" id="btn-search" class="btn-search" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </button>
        </div>
      </div>

      <div class="controls__group">
        <label for="order-select">Alphabetical Order</label>
        <select id="order-select">
          <option value="asc">A to Z (Ascending)</option>
          <option value="desc">Z to A (Descending)</option>
        </select>
      </div>

      <div class="controls__group">
        <label for="gender-select">Character Category</label>
        <select id="gender-select">
          <option value="all">All Characters</option>
          <option value="Female">Heroines & Villainesses</option>
          <option value="Male">Heroes & Villains</option>
        </select>
      </div>

      <div class="controls__group">
        <label for="publisher-select">Publisher</label>
        <select id="publisher-select">
          <option value="all">All Publishers</option>
          <option value="Marvel Comics">Marvel Comics</option>
          <option value="DC Comics">DC Comics</option>
          <option value="Dark Horse Comics">Dark Horse</option>
          <option value="Other">Other Publishers</option>
        </select>
      </div>
    </section>

    <div class="status-bar">
      <span id="results-count">Total results: 0</span>
    </div>

    <section id="heroes-grid" class="heroes-grid" aria-live="polite"></section>

<nav class="pagination">
  <button id="btn-first" class="pagination__btn" aria-label="First page">&laquo;</button>
  <button id="btn-prev" class="pagination__btn" aria-label="Previous page">&lsaquo;</button>
  <span id="page-indicator" class="pagination__indicator">Page 1 of 29</span>
  <button id="btn-next" class="pagination__btn" aria-label="Next page">&rsaquo;</button>
  <button id="btn-last" class="pagination__btn" aria-label="Last page">&raquo;</button>
</nav>
  </main>


  <div id="hero-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal__backdrop" id="modal-backdrop"></div>
    <div class="modal__content">
      <div class="modal__header">
        <span class="modal__system-tag">&gt;&gt; SYSTEM_TERMINAL // DATA_RECORD</span>
        <button type="button" class="modal__close" id="modal-close" aria-label="Close modal">[ X ]</button>
      </div>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
